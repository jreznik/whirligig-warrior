name: Build Playdate Game

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Required to accurately count commits

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpng-dev

    - name: Download Playdate SDK
      run: |
        wget https://download.panic.com/playdate_sdk/Linux/PlaydateSDK-latest.tar.gz -O PlaydateSDK.tar.gz
        mkdir -p $HOME/PlaydateSDK
        tar -xzvf PlaydateSDK.tar.gz -C $HOME/PlaydateSDK --strip-components=1

    - name: Run Build Script
      run: |
        export PLAYDATE_SDK_PATH=$HOME/PlaydateSDK
        chmod +x build.sh
        ./build.sh

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WhirligigWarrior-CI
        path: WhirligigWarrior.pdx
