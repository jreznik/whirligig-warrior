name: Build and Release Playdate Game

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Required for buildNumber (commit count)

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpng-dev zip

    - name: Download Playdate SDK
      run: |
        wget https://download.panic.com/playdate_sdk/Linux/PlaydateSDK-latest.tar.gz -O PlaydateSDK.tar.gz
        mkdir -p $HOME/PlaydateSDK
        tar -xzvf PlaydateSDK.tar.gz -C $HOME/PlaydateSDK --strip-components=1

    - name: Run Build Script
      run: |
        export PLAYDATE_SDK_PATH=$HOME/PlaydateSDK
        chmod +x build.sh
        ./build.sh

    - name: Prepare Artifact
      run: |
        zip -r WhirligigWarrior.pdx.zip WhirligigWarrior.pdx

    - name: Upload CI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WhirligigWarrior-CI
        path: WhirligigWarrior.pdx

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: WhirligigWarrior.pdx.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
